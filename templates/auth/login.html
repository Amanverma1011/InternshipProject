<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sologix Energy – Proposal Management System</title>
    <meta name="description" content="Sign in to Sologix Energy's Solar Proposal Management System – Ranchi, Jharkhand.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2e7d32">
    <meta property="og:title" content="Sologix Energy – Proposal System Login">
    <meta property="og:description" content="Sign in to manage solar proposals for Sologix Energy Private Limited.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 50%, #388e3c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-wrapper { width: 100%; max-width: 420px; }
        .brand-logo {
            text-align: center;
            margin-bottom: 1.5rem;
            color: white;
        }
        .brand-logo .sun-icon { font-size: 3rem; line-height: 1; }
        .brand-logo h1 { font-size: 1.8rem; font-weight: 700; margin: 0.4rem 0 0.2rem; letter-spacing: -0.5px; }
        .brand-logo .tagline { opacity: 0.8; font-size: 0.85rem; }
        .login-card {
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .login-card-body { padding: 2rem; }
        .login-card-body h2 { font-size: 1.2rem; font-weight: 600; color: #1b5e20; margin-bottom: 1.5rem; }
        .form-control-lg { border-radius: 0.6rem; font-size: 0.95rem; }
        .form-control:focus { border-color: #2e7d32; box-shadow: 0 0 0 0.2rem rgba(46,125,50,0.2); }
        .btn-login {
            background: linear-gradient(135deg, #2e7d32, #388e3c);
            border: none;
            border-radius: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            padding: 0.75rem;
            font-size: 1rem;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }
        .input-group .btn-eye {
            border: 1px solid #ced4da;
            border-left: none;
            background: #f8f9fa;
            color: #666;
            border-radius: 0 0.6rem 0.6rem 0 !important;
        }
        .input-group .btn-eye:hover { background: #e9ecef; color: #333; }
        .input-group .form-control-lg { border-radius: 0.6rem 0 0 0.6rem !important; }
        .footer-text { text-align: center; color: rgba(255,255,255,0.65); font-size: 0.78rem; margin-top: 1rem; }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="brand-logo">
        <div class="sun-icon">&#9728;&#xFE0F;</div>
        <h1>Sologix Energy</h1>
        <div class="tagline">Energizing Naturally</div>
    </div>

    <div class="login-card">
        <div class="login-card-body">
            <h2><i class="bi bi-lock me-2"></i>Sign In</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} py-2 small">
                <i class="bi bi-exclamation-circle me-1"></i>{{ msg }}
            </div>
            {% endfor %}
            {% endwith %}

            <form method="post" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-dark small">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted" style="border-radius:0.6rem 0 0 0.6rem;border-right:none;">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="username" class="form-control form-control-lg border-start-0"
                               style="border-radius:0 0.6rem 0.6rem 0;"
                               placeholder="Enter username" required autofocus autocomplete="username">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-dark small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted" style="border-radius:0.6rem 0 0 0.6rem;border-right:none;">
                            <i class="bi bi-key"></i>
                        </span>
                        <input type="password" name="password" id="passwordField" class="form-control form-control-lg border-start-0 border-end-0"
                               style="border-radius:0;"
                               placeholder="Enter password" required autocomplete="current-password">
                        <button class="btn btn-eye" type="button" id="togglePassword" tabindex="-1">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-login btn-success w-100 text-white">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                </button>
            </form>
        </div>
    </div>

    <p class="footer-text">Sologix Energy Private Limited &copy; {{ 2026 }}</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('togglePassword').addEventListener('click', function() {
    var field = document.getElementById('passwordField');
    var icon = document.getElementById('eyeIcon');
    if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        field.type = 'password';
        icon.className = 'bi bi-eye';
    }
});
</script>
</body>
</html>
