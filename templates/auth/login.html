<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sologix Energy</title>
    <meta name="description" content="Sign in to Sologix Energy's Solar Proposal Management System.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0F172A">
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #1e293b;
        }
        .login-wrapper { width: 100%; max-width: 400px; }
        .brand-mark {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .brand-mark img {
            height: 56px;
            border-radius: 10px;
        }
        .login-card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .login-card-body { padding: 2rem 2rem 1.75rem; }
        .login-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }
        .login-subtitle {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 1.75rem;
        }
        .form-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.35rem;
        }
        .form-control {
            border-radius: 7px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
            padding: 0.6rem 0.75rem;
            color: #1e293b;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-control:focus {
            border-color: #E8631A;
            box-shadow: 0 0 0 3px rgba(232,99,26,0.12);
            outline: none;
        }
        .input-group .input-group-text {
            border-radius: 7px 0 0 7px;
            border: 1px solid #cbd5e1;
            border-right: none;
            background: #f8fafc;
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .input-group .form-control {
            border-radius: 0 7px 7px 0;
            border-left: none;
        }
        .input-group .form-control:focus {
            border-color: #E8631A;
            box-shadow: 0 0 0 3px rgba(232,99,26,0.12);
        }
        .input-group:focus-within .input-group-text {
            border-color: #E8631A;
        }
        .btn-eye {
            border: 1px solid #cbd5e1;
            border-left: none;
            border-radius: 0 7px 7px 0 !important;
            background: #f8fafc;
            color: #94a3b8;
            padding: 0 0.75rem;
            transition: background 0.15s;
        }
        .btn-eye:hover { background: #f1f5f9; color: #475569; }
        .input-group .form-control.has-toggle {
            border-radius: 0;
        }
        .btn-login {
            background: #E8631A;
            border: none;
            border-radius: 7px;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.65rem;
            color: #fff;
            width: 100%;
            transition: background-color 0.15s ease;
            letter-spacing: 0.01em;
        }
        .btn-login:hover { background: #C4500F; color: #fff; }
        .btn-login:active { background: #a3420c; }
        .footer-note {
            text-align: center;
            color: #94a3b8;
            font-size: 0.72rem;
            margin-top: 1.25rem;
        }
        .alert {
            border-radius: 7px;
            border: none;
            font-size: 0.82rem;
            padding: 0.6rem 0.85rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="brand-mark">
        <img src="/static/images/logo.jpg" alt="Sologix Energy">
    </div>

    <div class="login-card">
        <div class="login-card-body">
            <div class="login-title">Sign in</div>
            <div class="login-subtitle">Sologix Energy Proposal System</div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }}">
                <i class="bi bi-exclamation-circle me-1"></i>{{ msg }}
            </div>
            {% endfor %}
            {% endwith %}

            <form method="post" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control"
                               placeholder="Enter username" required autofocus autocomplete="username">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" id="passwordField"
                               class="form-control has-toggle"
                               placeholder="Enter password" required autocomplete="current-password">
                        <button class="btn btn-eye" type="button" id="togglePassword" tabindex="-1">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
                </button>
            </form>
        </div>
    </div>

    <p class="footer-note">Sologix Energy Private Limited &copy; {{ 2026 }}</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('togglePassword').addEventListener('click', function() {
    var field = document.getElementById('passwordField');
    var icon = document.getElementById('eyeIcon');
    if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        field.type = 'password';
        icon.className = 'bi bi-eye';
    }
});
</script>
</body>
</html>
