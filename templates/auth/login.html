<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Sologix Proposal System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f4f0; min-height: 100vh; display: flex; align-items: center; }
        .login-card { max-width: 420px; width: 100%; margin: auto; }
        .brand-header { background: #2e7d32; color: white; padding: 2rem; text-align: center; border-radius: 0.5rem 0.5rem 0 0; }
        .brand-header h1 { font-size: 1.5rem; margin: 0; }
        .brand-header .subtitle { opacity: 0.8; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="login-card">
        <div class="brand-header">
            <i class="bi bi-sun-fill" style="font-size:2.5rem;"></i>
            <h1 class="mt-2">Sologix Energy</h1>
            <div class="subtitle">Proposal Management System</div>
        </div>
        <div class="card border-0 shadow-sm" style="border-radius:0 0 0.5rem 0.5rem;">
            <div class="card-body p-4">
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% for cat, msg in messages %}
                <div class="alert alert-{{ cat }}">{{ msg }}</div>
                {% endfor %}
                {% endwith %}
                <form method="post" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg"
                               placeholder="Enter username" required autofocus autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg"
                               placeholder="Enter password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                </form>
            </div>
        </div>
        <p class="text-center text-muted mt-3 small">Sologix Energy Private Limited &copy; 2026</p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
