{% extends "base.html" %}
{% block title %}New User – Sologix{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-person-plus me-2 text-success"></i>Create User</h2>
    <a href="{{ url_for('users.list_users') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Full Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" required value="{{ form_data.get('name','') if form_data else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Username <span class="text-danger">*</span></label>
                <input type="text" name="username" class="form-control" required value="{{ form_data.get('username','') if form_data else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Password <span class="text-danger">*</span></label>
                <input type="password" name="password" class="form-control" required minlength="6">
                <div class="form-text">Minimum 6 characters</div>
            </div>
            <div class="mb-4">
                <label class="form-label">Role</label>
                <select name="role" class="form-select">
                    <option value="USER">USER</option>
                    <option value="MASTER">MASTER</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100"><i class="bi bi-person-check me-2"></i>Create User</button>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}
